name: Savings P0 Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  zero-cost-reference-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate wave structure
        run: python w-savings-p0/tools/validate_wave.py
      - name: Validate Savings Workflow registry
        run: python factory/tools/validate_savings_registry.py
      - name: Validate materialized Savings Workflow packages
        run: python factory/tools/validate_savings_packages.py
      - name: Validate canonical HARDENED lifecycle
        run: python factory/tools/validate_savings_hardened.py
      - name: Validate canonical TESTED lifecycle
        run: python factory/tools/validate_savings_tested.py
      - name: Validate canonical APPROVED_BASELINE lifecycle
        run: python factory/tools/validate_savings_approved.py
      - name: Run zero-dependency tests and all reference demos
        working-directory: runtime/savings-p0
        run: npm run validate
