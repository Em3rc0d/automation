name: MK1 Evidence Sync Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence-derivation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest tools/savings/tests/test_mk1_evidence_sync.py
