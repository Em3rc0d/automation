name: Google Workspace Savings Connector Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  connector-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Google Workspace connector tests
        run: node --test connectors/savings/google-workspace/test/*.test.mjs
      - name: Re-run installation binding tests
        run: python -m unittest discover -s tools/savings/tests -p 'test_*.py' -v
      - name: Validate repository
        run: python tools/validate_repository.py
