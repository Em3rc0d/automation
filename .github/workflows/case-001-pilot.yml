name: CASE-001 Pilot

on:
  pull_request:
    paths:
      - 'apps/case-001/**'
      - '.github/workflows/case-001-pilot.yml'
  push:
    branches:
      - 'case-001/whatsapp-quote-assistant'
    paths:
      - 'apps/case-001/**'
      - '.github/workflows/case-001-pilot.yml'

jobs:
  test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: case001
          POSTGRES_USER: case001
          POSTGRES_PASSWORD: case001
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U case001 -d case001"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://case001:case001@127.0.0.1:5432/case001
      CASE001_MODE: mock
      CASE001_AI_PROVIDER: mock
      CASE001_MESSAGING_PROVIDER: local
      CASE001_ADMIN_TOKEN: ci-only
      CASE001_TENANT_ID: ci-case-001
      DEFAULT_CURRENCY: USD
      IGV_RATE: '0.18'
      MAX_AUTO_DISCOUNT_PCT: '8'
      MINIMUM_MARGIN_PCT: '22'
      QUOTE_VALIDITY_DAYS: '7'
      SAP_STALE_AFTER_HOURS: '24'
    defaults:
      run:
        working-directory: apps/case-001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
      - run: npm run build
      - run: docker compose config

  docker-poc-smoke:
    runs-on: ubuntu-latest
    env:
      CASE001_MODE: poc
      CASE001_AI_PROVIDER: mock
      CASE001_MESSAGING_PROVIDER: local
      CASE001_ADMIN_TOKEN: case001-local-only
      CASE001_TENANT_ID: case-001-pilot
    defaults:
      run:
        working-directory: apps/case-001
    steps:
      - uses: actions/checkout@v4
      - name: Simulate Windows CRLF checkout for DB init
        run: python3 -c "from pathlib import Path; p=Path('local/db/init.sh'); d=p.read_bytes().replace(b'\r\n', b'\n'); p.write_bytes(d.replace(b'\n', b'\r\n'))"
      - name: Build and boot local PoC
        run: docker compose up -d --build --wait
      - name: Verify health and seeded database
        run: |
          curl -fsS http://127.0.0.1:3000/api/health | tee /tmp/case001-health.json
          grep -q '"ok":true' /tmp/case001-health.json
          curl -fsS -H 'x-admin-token: case001-local-only' http://127.0.0.1:3000/api/status | tee /tmp/case001-status.json
          grep -q '"productRows":3' /tmp/case001-status.json
      - name: Exercise local message to deterministic quote
        run: |
          curl -fsS \
            -H 'x-admin-token: case001-local-only' \
            -H 'content-type: application/json' \
            -d '{"phone":"+51999999999","text":"Cotizame 10 EPOX-7000-GRIS","providerMessageId":"docker-smoke-001"}' \
            http://127.0.0.1:3000/api/poc/message | tee /tmp/case001-message.json
          grep -q '"status":"sent"' /tmp/case001-message.json
      - name: Prove clean-volume reset
        run: |
          docker compose down -v
          docker compose up -d --wait
          curl -fsS http://127.0.0.1:3000/api/health | tee /tmp/case001-health-reset.json
          grep -q '"ok":true' /tmp/case001-health-reset.json
          curl -fsS -H 'x-admin-token: case001-local-only' http://127.0.0.1:3000/api/status | tee /tmp/case001-status-reset.json
          grep -q '"productRows":3' /tmp/case001-status-reset.json
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down PoC
        if: always()
        run: docker compose down -v
