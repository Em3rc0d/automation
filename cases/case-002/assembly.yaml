case: CASE-002
name: AUTOMOTIVE_WORKSHOP_SERVICE_INTAKE
version: 0.1.1
status: ASSEMBLY_CANDIDATE
authority: cases/CASE-002-AUTOMOTIVE-WORKSHOP-SERVICE-INTAKE.md
runtime_target:
  engine: n8n
  profile: n8n-base-js-v1
  pinned_version: 2.38.7
invariants:
- customer_reported_condition != automated_observation != technician_finding != diagnosis
- media_binary_not_in_execution_logs
- ai_has_no_mechanical_diagnosis_authority
- side_effects_are_idempotent
- provider_ids_are_persisted
- tenant_scope_is_required
adapter_policy:
  whatsapp:
    preferred:
    - Kapso
    - OpenWA
    direct_meta_cloud_api: fallback_or_reference_only
    rule: business semantics depend on messaging capabilities, not a hard-coded WhatsApp provider
stages:
- id: ingress
  semantic: WHATSAPP_INBOUND
  status: NEEDS_SYNTHESIS
  quarry:
  - batch-005:A1
  - batch-005:A2
  - batch-006:Standard Webhooks
  adapter:
    preferred:
    - Kapso
    - OpenWA
    fallback: Meta WhatsApp Cloud API
- id: message_normalize
  semantic: MESSAGE_INTAKE
  status: DESIGNED_MINED
  quarry:
  - batch-005:A1
  - batch-001:A03
  output: ServiceRequest input
- id: customer_vehicle
  semantic: DOMAIN_RESOLUTION
  status: CASE_DOMAIN
  notes: Customer/Vehicle lookup or collection; not admitted as toolbox capability
- id: service_request
  semantic: WORK_REQUEST_INTAKE
  status: NEEDS_SYNTHESIS
  quarry:
  - batch-001:A03
  - batch-008:support-sla
  - capability-library:work-order
- id: evidence_request
  semantic: POLICY_CONFIG
  status: CASE_POLICY
  notes: request media only when useful for configured symptom/category
- id: media_fetch
  semantic: WHATSAPP_MEDIA_FETCH
  status: NEEDS_SYNTHESIS
  quarry:
  - batch-005:A1
  - batch-005:A2
  adapter:
    preferred:
    - Kapso
    - OpenWA
    fallback: Meta WhatsApp Cloud API
- id: evidence_store
  semantic: STORAGE_ADAPTER_COMPOSITION
  status: DESIGNED_MINED
  requires:
  - storage.file.put
  - storage.file.hash
- id: visual_assessment
  semantic: VISUAL_EVIDENCE_ASSESS_CANDIDATE
  status: CASE_COMPOSITION
  quarry:
  - batch-005:paperflow
  - batch-005:structured-extraction
  admission: DEFER
- id: triage
  semantic: DETERMINISTIC_OPERATIONAL_TRIAGE
  status: CASE_POLICY
  quarry:
  - batch-001:A03
  - batch-008:support-sla
  output: triage-decision.schema.json
- id: human_review
  semantic: HUMAN_REVIEW_TASK
  status: IN_CERTIFICATION
  quarry:
  - batch-006:durable-approval
  - batch-008:approvals
- id: appointment_request
  semantic: APPOINTMENT_REQUEST
  status: IN_CERTIFICATION
  quarry:
  - batch-002:B12
  - batch-004:D03
- id: availability
  semantic: AVAILABILITY_CHECK
  status: IN_CERTIFICATION
  quarry:
  - batch-007:reliable-calendar-booking
  adapter: Google Calendar first
- id: slot_hold
  semantic: SLOT_HOLD
  status: IN_CERTIFICATION
  quarry:
  - batch-002:appointment-decomposition
  - batch-007:double-booking-prevention
- id: appointment_create
  semantic: APPOINTMENT_CREATE
  status: IN_CERTIFICATION
  quarry:
  - batch-002:B12
  - batch-007:Cal.com-semantics
  persist:
  - providerEventId
- id: work_order
  semantic: WORK_ORDER_CREATE
  status: PARTIAL_NEEDS_SYNTHESIS
  quarry:
  - capability-library:work-order
  - certification:priority-a-field-service
- id: confirmation
  semantic: APPOINTMENT_CONFIRM
  status: IN_CERTIFICATION
  quarry:
  - batch-007:reliable-calendar-booking
  adapter: messaging.send via configured WhatsApp adapter
- id: telemetry
  semantic: EXECUTION_TELEMETRY
  status: HARDENED
  package: quarries/workflow-quarry/30-hardened/platform/EXECUTION_TELEMETRY@1.0
- id: incident
  semantic: ERROR_TO_INCIDENT
  status: HARDENED
  package: quarries/workflow-quarry/30-hardened/platform/ERROR_TO_INCIDENT@1.0
blocked_v1:
- semantic: FIELD_SERVICE_DISPATCH
  reason: capability gap; roadside/tow requests route to human review
- semantic: WARRANTY_ELIGIBILITY_EVALUATE
  reason: not admitted; human review remains authority
- semantic: MECHANICAL_DIAGNOSIS
  reason: explicit non-goal; technician authority
contracts:
- contracts/service-request.schema.json
- contracts/evidence.schema.json
- contracts/visual-assessment.schema.json
- contracts/triage-decision.schema.json
fixtures:
- fixtures/acceptance-fixtures.json
