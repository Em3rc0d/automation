services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - case003_pg:/var/lib/postgresql/data
      - ../build/canonical-model.sql:/docker-entrypoint-initdb.d/001-canonical-model.sql:ro
      - ../build/notification-idempotency.sql:/docker-entrypoint-initdb.d/002-notification-idempotency.sql:ro
      - ../build/gate3-reservation-core.sql:/docker-entrypoint-initdb.d/003-gate3-reservation-core.sql:ro
      - ../build/gate5-supplier-query-core.sql:/docker-entrypoint-initdb.d/004-gate5-supplier-query-core.sql:ro
      - ../build/gate6-channel-ingress-core.sql:/docker-entrypoint-initdb.d/005-gate6-channel-ingress-core.sql:ro
      - ./sql/010-synthetic-smoke.sql:/docker-entrypoint-initdb.d/010-synthetic-smoke.sql:ro
      - ./sql/020-gate5-access-smoke.sql:/docker-entrypoint-initdb.d/020-gate5-access-smoke.sql:ro
      - ./gate6-synthetic-channel-fixture.sql:/docker-entrypoint-initdb.d/030-gate6-channel-smoke.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:2.38.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      N8N_USER_FOLDER: /home/node
      DB_SQLITE_DATABASE: /home/node/.n8n/database.sqlite
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}
      CASE003_EXPECTED_PRE_WORKFLOWS: ${CASE003_EXPECTED_PRE_WORKFLOWS:-0}
      CASE003_EXPECTED_PRE_CREDENTIALS: ${CASE003_EXPECTED_PRE_CREDENTIALS:-0}
      CASE003_PG_HOST: ${CASE003_PG_HOST:-postgres}
      CASE003_PG_DATABASE: ${CASE003_PG_DATABASE:-case003}
      CASE003_PG_USER: ${CASE003_PG_USER:-case003}
      CASE003_PG_PASSWORD: ${CASE003_PG_PASSWORD:-change-me}
      CASE003_PG_PORT: ${CASE003_PG_PORT:-5432}
      CASE003_PG_SSL: ${CASE003_PG_SSL:-disable}
      CASE003_SUPABASE_URL: ${CASE003_SUPABASE_URL:-}
      CASE003_SUPABASE_PUBLISHABLE_KEY: ${CASE003_SUPABASE_PUBLISHABLE_KEY:-}
      CASE003_RPC_TOKEN: ${CASE003_RPC_TOKEN:-}
      CASE003_RULE_CODE: ${CASE003_RULE_CODE:-due_3d}
      CASE003_EXPECTED_SMOKE_TENANT_ID: ${CASE003_EXPECTED_SMOKE_TENANT_ID:-30000000-0000-0000-0000-000000000000}
      CASE003_EXPECTED_SMOKE_INVOICE_ID: ${CASE003_EXPECTED_SMOKE_INVOICE_ID:-30000000-0000-0000-0000-000000000100}
      CASE003_GATE5_TENANT_ID: ${CASE003_GATE5_TENANT_ID:-30000000-0000-0000-0000-000000000000}
      CASE003_GATE5_INVOICE_REFERENCE: ${CASE003_GATE5_INVOICE_REFERENCE:-F001-100}
      CASE003_GATE5_COMPANY_CODE: ${CASE003_GATE5_COMPANY_CODE:-PE10}
      CASE003_GATE5_FI_DOCUMENT: ${CASE003_GATE5_FI_DOCUMENT:-5100000100}
      CASE003_GATE5_SNAPSHOT_ID: ${CASE003_GATE5_SNAPSHOT_ID:-30000000-0000-0000-0000-000000000001}
      CASE003_GATE6_TENANT_ID: ${CASE003_GATE6_TENANT_ID:-30000000-0000-0000-0000-000000000000}
      CASE003_GATE6_INVOICE_REFERENCE: ${CASE003_GATE6_INVOICE_REFERENCE:-F001-100}
      CASE003_GATE6_TAX_ID: ${CASE003_GATE6_TAX_ID:-20000000001}
      CASE003_GATE6_VERIFIED_SUBJECT: ${CASE003_GATE6_VERIFIED_SUBJECT:-gate6-whatsapp-authorized-v1}
    ports:
      - "5678:5678"
    volumes:
      - case003_n8n:/home/node/.n8n
      - ./n8n:/opt/case003/n8n:ro
      - ./scripts:/opt/case003/scripts:ro

volumes:
  case003_pg:
  case003_n8n:
