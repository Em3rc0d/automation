services:
  mock-control-plane:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ../mock/wiremock:/home/wiremock:ro
    ports:
      - "18080:8080"
    networks: [factory]

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.38.7}
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-factory-ci-encryption-key-do-not-use-in-production}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      # Baselines are operator-controlled and refer to runtime configuration/secrets
      # through $env expressions. Customer workflows do not receive editor access.
      # Repository/static gates still forbid embedding secret values or credential refs.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_LOG_LEVEL: warn
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      AUTOMATION_CONTROL_PLANE_URL: http://mock-control-plane:8080
      AUTOMATION_CONTROL_PLANE_TOKEN: ${AUTOMATION_CONTROL_PLANE_TOKEN:-factory-test-token}
      TZ: UTC
    ports:
      - "5678:5678"
    volumes:
      - ../../:/workspace:ro
      - n8n_data:/home/node/.n8n
    networks: [factory]
    depends_on:
      - mock-control-plane
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

networks:
  factory: {}

volumes:
  n8n_data: {}
