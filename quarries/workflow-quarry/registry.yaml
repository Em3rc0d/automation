promotion_policy:
  stages:
    - DISCOVERED
    - LICENSE_CHECKED
    - INSPECTED
    - HARDENED
    - TESTED
    - APPROVED_BASELINE
  failed_gate_is_terminal: false
  failed_gate_destination: quarries/workflow-quarry/no-pass-verified
  allow_reentry_after_remediation: true
  approved_destination: workflows/n8n
  no_bulk_approval: true
  require_per_workflow_or_provenance_cohort_evidence: true
  retain_all_candidate_metadata: true
  retain_duplicate_provenance: true
  semantic_deduplication_for_review: true
  raw_external_code_policy: "Do not mirror raw external workflow code into the public repo unless redistribution/provenance is adequate. Preserve metadata, path, source commit/blob hash and findings regardless."
